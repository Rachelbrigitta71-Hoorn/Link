/* ---------- HULP ---------- */
// Fisher-Yates
function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// antwoordopties door elkaar, zodat het goede antwoord niet steeds bij A staat
function shuffleOpts(opts) { return shuffle(opts); }
function full(x) { return (x.a ? x.a + ' ' : '') + x.w; }
function spoken(s) { return s.replace(/\s*\([^)]*\)/g, ''); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function zinPlain(z) { return z.replace(/\*\*/g, ''); }
function zinHtml(z) { return esc(z).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function zinForm(z) { const m = z.match(/\*\*(.+?)\*\*/); return m ? m[1] : ''; }

/* ---------- SPRAAK ---------- */
let nlVoice = null;
const canSpeak = 'speechSynthesis' in window;
function pickVoice() {
  if (!canSpeak) return;
  const v = speechSynthesis.getVoices();
  nlVoice = v.find(x => /^nl[-_]NL/i.test(x.lang)) || v.find(x => /^nl/i.test(x.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function utter(text, slow) {
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.lang = 'nl-NL';
  if (nlVoice) u.voice = nlVoice;
  u.rate = slow ? 0.6 : 0.85;
  return u;
}

  if (!canSpeak) return;
  speechSynthesis.cancel();
  (Array.isArray(parts) ? parts : [parts]).forEach(t => speechSynthesis.speak(utter(t, slow)));
}

/* ---------- STATUS ---------- */
let taak = 'all', tab = 'woorden';
let Q = [], qi = 0, score = 0, wrongs = [];

function pool() { return W.filter(x => taak === 'all' || x.t === taak); }

function buildControls() {
  const tk = document.getElementById('taken');
  TAKEN.forEach(([v, label]) => {
    const b = document.createElement('button');
    b.className = 'pill' + (v === taak ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { taak = v; tk.querySelectorAll('.pill').forEach(x => x.classList.remove('active')); b.classList.add('active'); openTab(tab); };
    tk.appendChild(b);
  });
  const tb = document.getElementById('tabs');
  TABS.forEach(([id, ic, lb]) => {
    const b = document.createElement('button');
    b.className = 'tab' + (id === tab ? ' active' : '');
    b.dataset.id = id;
    b.innerHTML = '<span class="ic">' + ic + '</span><span class="lb">' + lb + '</span>';
    b.onclick = () => openTab(id);
    tb.appendChild(b);
  });
}

const INTRO = {
  luister: ['🎧 Luisteren', '🔊 Luister. 👆 Kies het woord.'],
  dehet:   ['🔤 De of het?', '👀 Kijk. 👆 <b>de</b> of <b>het</b>?'],
  sorteer: ['🧺 Sorteren', '👀 Kijk. 👆 Kies de groep.'],
  kies:    ['✏️ Kies het woord', '👀 Kijk. 👆 Kies het woord.']
};

function openTab(id) {
  tab = id;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  if (canSpeak) speechSynthesis.cancel();
  if (id === 'woorden') return renderWoorden();
  const p = document.getElementById('panel');
  const [t, how] = INTRO[id];
  const n = buildQuestions(id).length;
  p.innerHTML = '<h2>' + t + '</h2><p class="how">' + how + '</p>' +
    '<div class="warn" id="warn"></div>' +
    (n ? '<div class="next-row"><button class="btn start" id="go">▶ Start (' + n + ')</button></div>'
       : '<p class="how">Hier zijn geen vragen. Kies een andere taak.</p>');
  checkVoice();
  const go = document.getElementById('go');
  if (go) go.onclick = () => startQuiz(buildQuestions(id));
}

function checkVoice() {
  const w = document.getElementById('warn');
  if (!w) return;
  setTimeout(() => {
    pickVoice();
    if (!canSpeak) { w.textContent = 'Deze browser kan niet voorlezen. Probeer een andere browser.'; w.style.display = 'block'; }
    else if (!nlVoice) { w.textContent = 'Tip: er is geen Nederlandse stem gevonden. Zet in de instellingen van je telefoon of computer de spraak op Nederlands.'; w.style.display = 'block'; }
  }, 800);
}

/* ---------- WOORDENLIJST ---------- */
function renderWoorden() {
  const p = document.getElementById('panel');
  const groups = taak === 'all' ? [1,2,3,4] : [taak];
  let html = '<h2>📖 Woorden</h2><p class="how">👆 Klik. 🔊 Luister. 🗣️ Zeg het na.</p><div class="warn" id="warn"></div>';
  groups.forEach(g => {
    const list = W.filter(x => x.t === g);
    html += '<div class="wl-head">Taak ' + g + ' · ' + esc(TITELS[g]) + ' · ' + list.length + '</div>';
    html += '<div class="wl">' + list.map(x => {
      const i = W.indexOf(x);
      return '<div class="wcard' + (x.z ? ' has-zin' : '') + '" data-i="' + i + '"><span class="we">' + (x.e || '') + '</span>' +
        '<span class="ww">' + (x.a ? '<small>' + x.a + '</small> ' : '') + esc(x.w) +
        (x.z ? '<span class="wz">' + zinHtml(x.z) + '</span>' : '') + '</span><span class="sp">🔊</span></div>';
    }).join('') + '</div>';
  });
  p.innerHTML = html;
  p.querySelectorAll('.wcard').forEach(c => c.onclick = () => {
    const x = W[+c.dataset.i];
    say(x.z ? [full(x), zinPlain(x.z)] : full(x));
  });
  checkVoice();
}

/* ---------- VRAGEN MAKEN ---------- */
// foute keuzes bij een plaatje: hetzelfde soort woord (naamwoord, werkwoord of ander woord),
// maar uit een andere groep en met een ander plaatje, zodat de betekenis duidelijk anders is
function soort(y) { return y.a ? 'n' : (y.g === 'doe' ? 'v' : 'o'); }
function pictureDistractors(x) {
  const ok = y => y !== x && y.e && !y.z && y.g !== x.g && y.e !== x.e;
  const same = y => ok(y) && soort(y) === soort(x);
  let cand = shuffle(pool().filter(same));
  if (cand.length < 3) cand = cand.concat(shuffle(W.filter(y => same(y) && !cand.includes(y))));
  if (cand.length < 3) cand = cand.concat(shuffle(pool().filter(y => ok(y) && !cand.includes(y))));
  if (cand.length < 3) cand = cand.concat(shuffle(W.filter(y => ok(y) && !cand.includes(y))));
  return cand.slice(0, 3);
}

function buildQuestions(mode) {
  const P = pool();
  if (mode === 'luister') {
    return shuffle(P).slice(0, 10).map(x => {
      const ok = y => y !== x && spoken(y.w) !== spoken(x.w);
      let others = P.filter(ok);
      if (others.length < 3) others = W.filter(ok);
      // geen twee keuzes die hetzelfde klinken (bijv. je (jij) en je (jouw))
      const pick = [];
      for (const y of shuffle(others)) { if (pick.length < 3 && !pick.some(z => spoken(z.w) === spoken(y.w))) pick.push(y); }
      return { mode, x, opts: shuffleOpts([x, ...pick]) };
    });
  }
  if (mode === 'dehet') return shuffle(P.filter(x => x.a)).slice(0, 12).map(x => ({ mode, x }));
  if (mode === 'sorteer') return shuffle(P.filter(x => x.c)).slice(0, 12).map(x => ({ mode, x }));
  if (mode === 'kies') {
    return shuffle(P.filter(x => x.z || x.e)).slice(0, 12).map(x => {
      if (x.z) {
        const ans = zinForm(x.z).toLowerCase();
        return { mode, x, kind: 'zin', ans, opts: shuffleOpts([ans, ...x.d]) };
      }
      const ans = full(x);
      return { mode, x, kind: 'plaatje', ans, opts: shuffleOpts([ans, ...pictureDistractors(x).map(full)]) };
    });
  }
  return [];
}

/* ---------- QUIZ ---------- */
function startQuiz(list) {
  Q = list.map(q => q.opts ? { ...q, opts: shuffleOpts(q.opts) } : { ...q });
  qi = 0; score = 0; wrongs = [];
  renderQ();
}

function head() {
  return '<div class="progress"><div>Vraag <span>' + (qi + 1) + '</span> / ' + Q.length + '</div><div>✓ <span>' + score + '</span></div></div>' +
         '<div class="bar"><div style="width:' + (qi / Q.length * 100) + '%"></div></div>';
}

function renderQ() {
  if (qi >= Q.length) return showResult();
  const q = Q[qi], p = document.getElementById('panel');
  let html = head();
  if (q.mode === 'luister') {
    html += '<div class="listen-row"><button class="speak" id="sp">🔊 Luister</button><button class="speak slow" id="spS">🐢 Langzaam</button></div>' +
            '<div class="opts">' + q.opts.map((o, i) => '<button class="opt" data-i="' + i + '"><span class="oe">' + (o.e || '') + '</span>' + esc(o.w) + '</button>').join('') + '</div>';
  } else if (q.mode === 'dehet') {
    html += '<div class="big-emoji">' + (q.x.e || '') + '</div><div class="big-word">… ' + esc(q.x.w) + '</div>' +
            '<div class="opts"><button class="opt big" data-v="de">de</button><button class="opt big" data-v="het">het</button></div>';
  } else if (q.mode === 'sorteer') {
    html += '<div class="big-emoji">' + (q.x.e || '') + '</div><div class="big-word">' + esc(full(q.x)) + '</div>' +
            '<div class="listen-row"><button class="speak small" id="sp">🔊</button></div>' +
            '<div class="opts three">' + Object.entries(CATS).map(([k, v]) => '<button class="opt" data-v="' + k + '">' + v + '</button>').join('') + '</div>';
  } else if (q.mode === 'kies') {
    if (q.kind === 'zin') {
      html += '<div class="sentence" id="zin">' + esc(zinPlain(q.x.z.replace(/\*\*(.+?)\*\*/, '§'))).replace('§', '<span class="gap">&nbsp;</span>') + '</div>';
    } else {
      html += '<div class="big-emoji">' + q.x.e + '</div>';
    }
    html += '<div class="opts">' + q.opts.map(o => '<button class="opt" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  }
  html += '<div class="fb" id="fb"></div><div class="tip" id="tip"></div><div class="next-row" id="nx"></div>';
  p.innerHTML = html;

  if (q.mode === 'luister') {
    document.getElementById('sp').onclick = () => say(full(q.x));
    document.getElementById('spS').onclick = () => say(full(q.x), true);
    say(full(q.x));
    p.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, q.opts[+b.dataset.i] === q.x, q.x.w));
  } else if (q.mode === 'dehet') {
    p.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, b.dataset.v === q.x.a, q.x.a));
  } else if (q.mode === 'sorteer') {
    document.getElementById('sp').onclick = () => say(full(q.x));
    p.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, b.dataset.v === q.x.c, q.x.c));
  } else if (q.mode === 'kies') {
    p.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, b.dataset.v === q.ans, q.ans));
  }
}

function answer(btn, ok, correct) {
  const q = Q[qi], p = document.getElementById('panel');
  p.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const val = q.mode === 'luister' ? q.opts[+b.dataset.i].w : b.dataset.v;
    if (val === correct) b.classList.add('ok');
  });
  if (!ok) btn.classList.add('bad');
  if (ok) score++; else wrongs.push(q);

  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  if (q.mode === 'luister') {
    fb.textContent = ok ? '✓ Goed! ' + full(q.x) : '✗ ' + full(q.x);
  } else if (q.mode === 'dehet') {
    fb.textContent = (ok ? '✓ Goed! ' : '✗ ') + full(q.x);
    say(full(q.x));
  } else if (q.mode === 'sorteer') {
    fb.textContent = ok ? '✓ Goed!' : '✗ ' + CATS[q.x.c];
    say(full(q.x));
  } else if (q.mode === 'kies') {
    if (q.kind === 'zin') {
      const form = zinForm(q.x.z);
      document.querySelector('#zin .gap').textContent = form;
      fb.textContent = ok ? '✓ Goed!' : '✗ ' + form;
      say(zinPlain(q.x.z));
    } else {
      fb.textContent = ok ? '✓ Goed! ' + q.ans : '✗ ' + q.ans;
      say(q.ans);
    }
  }
  document.getElementById('nx').innerHTML = '<button class="btn" id="nb">' + (qi < Q.length - 1 ? 'Volgende →' : 'Klaar ✓') + '</button>';
  document.getElementById('nb').onclick = () => { qi++; renderQ(); };
  document.getElementById('nb').focus();
}

function showResult() {
  const p = document.getElementById('panel');
  const pct = Q.length ? score / Q.length : 0;
  const msg = pct === 1 ? 'Super! 🎉' : pct >= 0.8 ? 'Heel goed! 👍' : pct >= 0.5 ? 'Goed bezig! 💪' : 'Kijk bij 📖 Woorden. Probeer het opnieuw. 💪';
  p.innerHTML = '<div class="result"><div class="avatar-box av">🏠</div>' +
    '<div class="score">' + score + '/' + Q.length + '</div><div class="msg">' + msg + '</div><div class="btns">' +
    (wrongs.length ? '<button class="btn alt" id="rw">✗ Oefen de fouten (' + wrongs.length + ')</button>' : '') +
    '<button class="btn" id="rn">↺ Nieuwe ronde</button></div></div>';
  setAvatar();
  if (wrongs.length) document.getElementById('rw').onclick = () => startQuiz(wrongs);
  document.getElementById('rn').onclick = () => startQuiz(buildQuestions(tab));
}

/* ---------- AVATAR ----------
   De avatar wordt uit overzicht_link.html (zelfde map op GitHub) gehaald.
   Lukt dat niet (bijv. bestand lokaal geopend), dan blijft het emoji-plaatje staan. */
let avatarSrc = null;
function setAvatar() {
  if (!avatarSrc) return;
  document.querySelectorAll('.av').forEach(el => { if (!el.querySelector('img')) el.innerHTML = '<img src="' + avatarSrc + '" alt="docent">'; });
}
fetch('overzicht_link.html')
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(h => { const m = h.match(/data:image\/[a-z]+;base64,[A-Za-z0-9+\/=]+/); if (m) { avatarSrc = m[0]; setAvatar(); } })
  .catch(() => {});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { const nb = document.getElementById('nb'); if (nb) { e.preventDefault(); nb.click(); } }
});

buildControls();
openTab('woorden');
</script>
