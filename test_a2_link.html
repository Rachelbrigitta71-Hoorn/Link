const ALL = [];
Object.keys(DATA).forEach(n => DATA[n].w.forEach(r => ALL.push({ t: +n, w: r[0], a: r[1], e: r[2], g: r[3], z: r[4], d: r[5] })));
const THEMES = Object.keys(DATA).map(n => +n);

/* ---------- HULP ---------- */
// Fisher-Yates
function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// antwoordopties door elkaar, zodat het goede antwoord niet steeds bij A staat
function shuffleOpts(opts) { return shuffle(opts); }
function full(x) { return (x.a ? x.a + ' ' : '') + x.w; }
function spoken(s) { return s.replace(/\s*\([^)]*\)/g, ''); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function zinPlain(z) { return z.replace(/\*\*/g, ''); }
function zinForm(z) { const m = z.match(/\*\*(.+?)\*\*/); return m ? m[1] : ''; }
function zinGap(z) { return esc(zinPlain(z.replace(/\*\*(.+?)\*\*/, '§'))).replace('§', '<span class="gap">&nbsp;</span>'); }

/* ---------- SPRAAK ---------- */
let nlVoice = null;
const canSpeak = 'speechSynthesis' in window;
function pickVoice() {
  if (!canSpeak) return;
  const v = speechSynthesis.getVoices();
  nlVoice = v.find(x => /^nl[-_]NL/i.test(x.lang)) || v.find(x => /^nl/i.test(x.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, slow) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.lang = 'nl-NL';
  if (nlVoice) u.voice = nlVoice;
  u.rate = slow ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}

/* ---------- VRAGEN MAKEN ---------- */
function soort(y) { return y.a ? 'n' : (y.g === 'doe' ? 'v' : 'o'); }
function pictureDistractors(x) {
  const ok = y => y !== x && y.e && !y.z && y.g !== x.g && y.e !== x.e;
  const same = y => ok(y) && soort(y) === soort(x);
  const th = ALL.filter(y => y.t === x.t);
  let cand = shuffle(th.filter(same));
  if (cand.length < 3) cand = cand.concat(shuffle(th.filter(y => ok(y) && !cand.includes(y))));
  return cand.slice(0, 3);
}
function makeQ(x) {
  const r = Math.random();
  const luister = () => {
    const th = ALL.filter(y => y.t === x.t && y !== x && spoken(y.w) !== spoken(x.w));
    const pick = [];
    for (const y of shuffle(th)) { if (pick.length < 3 && !pick.some(z => spoken(z.w) === spoken(y.w))) pick.push(y); }
    return { type: 'luister', x, ans: full(x), opts: shuffleOpts([full(x), ...pick.map(full)]) };
  };
  const dehet = () => ({ type: 'dehet', x, ans: x.a, opts: ['de', 'het'] });
  if (x.z) {
    if (r < 0.7) { const ans = zinForm(x.z).toLowerCase(); return { type: 'zin', x, ans, opts: shuffleOpts([ans, ...x.d]) }; }
    if (r < 0.9 || !x.a) return luister();
    return dehet();
  }
  if (r < 0.45) return luister();
  if (r < 0.7 && x.a) return dehet();
  return { type: 'plaatje', x, ans: full(x), opts: shuffleOpts([full(x), ...pictureDistractors(x).map(full)]) };
}
// woorden eerlijk verdelen over de thema's
function pickWords(n) {
  const per = THEMES.map(t => shuffle(ALL.filter(x => x.t === t)));
  const out = [];
  let i = 0;
  while (out.length < n && per.some(l => l.length)) { const l = per[i % per.length]; if (l.length) out.push(l.pop()); i++; }
  return shuffle(out);
}

  const q = Q[qi], p = document.getElementById('panel');
  let html = '<div class="progress"><div>' + (mode === 'test' ? 'Test' : 'Fouten oefenen') + ' · vraag <span>' + (qi + 1) + '</span> / ' + Q.length + '</div>' +
    (mode === 'oefen' ? '<div>Goed: <span>' + (qi - wrongs.length) + '</span></div>' : '<div></div>') + '</div>' +
    '<div class="bar"><div style="width:' + (qi / Q.length * 100) + '%"></div></div>' +
    '<div class="qtype">' + HOW[q.type] + '</div>';
  if (q.type === 'zin') html += '<div class="sentence" id="zin">' + zinGap(q.x.z) + '</div>';
  else if (q.type === 'luister') html += '<div class="listen-row"><button class="speak" id="sp">🔊 Luister</button><button class="speak slow" id="spS">🐢 Langzaam</button></div>';
  else if (q.type === 'dehet') html += '<div class="big-word">… ' + esc(q.x.w) + '</div>';
  else html += '<div class="big-emoji">' + q.x.e + '</div>';
  html += '<div class="opts">' + q.opts.map(o => '<button class="opt' + (q.type === 'dehet' ? ' big' : '') + '" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>' +
    '<div class="fb" id="fb"></div><div class="next-row" id="nx"></div>';
  p.innerHTML = html;
  if (q.type === 'luister') {
    document.getElementById('sp').onclick = () => say(q.ans);
    document.getElementById('spS').onclick = () => say(q.ans, true);
    say(q.ans);
  }
  p.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(b));
}

function choose(btn) {
  const q = Q[qi], p = document.getElementById('panel'), v = btn.dataset.v, ok = v === q.ans;
  if (mode === 'test') {
    answers.push({ q, v, ok });
    btn.classList.add('chosen');
    p.querySelectorAll('.opt').forEach(b => b.disabled = true);
    setTimeout(() => { qi++; renderQ(); }, 250);
    return;
  }
  p.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.v === q.ans) b.classList.add('ok'); });
  if (!ok) { btn.classList.add('bad'); wrongs.push(q); }
  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  if (q.type === 'zin') {
    document.querySelector('#zin .gap').textContent = zinForm(q.x.z);
    fb.textContent = ok ? '✓ Goed!' : '✗ Het goede woord is: ' + zinForm(q.x.z);
    say(zinPlain(q.x.z));
  } else if (q.type === 'dehet') { fb.textContent = (ok ? '✓ Goed! ' : '✗ Het is: ') + full(q.x); say(full(q.x)); }
  else { fb.textContent = ok ? '✓ Goed! ' + q.ans : '✗ Het goede woord is: ' + q.ans; say(q.ans); }
  document.getElementById('nx').innerHTML = '<button class="btn" id="nb">' + (qi < Q.length - 1 ? 'Volgende →' : 'Klaar ✓') + '</button>';
  document.getElementById('nb').onclick = () => { qi++; renderQ(); };
  document.getElementById('nb').focus();
}

function qText(q) {
  if (q.type === 'zin') return zinGap(q.x.z);
  if (q.type === 'luister') return 'Luisteren: ' + esc(q.ans);
  if (q.type === 'dehet') return '… ' + esc(q.x.w);
  return 'Plaatje ' + q.x.e;
}
function showResult() {
  const p = document.getElementById('panel');
  const good = answers.filter(a => a.ok).length, n = answers.length, pct = Math.round(good / n * 100);
  wrongs = answers.filter(a => !a.ok).map(a => a.q);
  const per = THEMES.map(t => { const l = answers.filter(a => a.q.x.t === t); return [t, l.filter(a => a.ok).length, l.length]; }).filter(r => r[2]);
  const msg = pct >= 90 ? 'Heel goed! Je kent de woorden goed.' : pct >= 70 ? 'Goed! Oefen de fouten nog een keer.' : pct >= 50 ? 'Je bent goed bezig. Oefen de fouten en kijk nog eens bij de thema\'s.' : 'Oefen de woorden nog een keer bij de thema\'s. Doe daarna de fouten opnieuw.';
  p.innerHTML = '<div class="result"><div class="avatar-box av">📝</div>' +
    '<div class="score">' + good + '/' + n + '</div><div class="msg">' + pct + '% goed. ' + msg + '</div>' +
    '<div class="h3">Per thema</div><table class="per">' + per.map(r => '<tr><td>Thema ' + r[0] + ' · ' + esc(DATA[r[0]].title) + '</td><td class="n">' + r[1] + ' / ' + r[2] + '</td></tr>').join('') + '</table>' +
    (wrongs.length ? '<div class="h3">Je fouten (' + wrongs.length + ')</div><div class="fouten">' + answers.filter(a => !a.ok).map(a =>
      '<div class="fout"><div class="q">' + qText(a.q) + '</div>Jij: <span class="jij">' + esc(a.v) + '</span> · Goed: <span class="goed">' + esc(a.q.type === 'zin' ? zinForm(a.q.x.z) : a.q.ans) + '</span></div>').join('') + '</div>' : '') +
    '<div class="btns">' + (wrongs.length ? '<button class="btn alt" id="rw">✗ Doe de fouten opnieuw (' + wrongs.length + ')</button>' : '') +
    '<button class="btn" id="rn">↺ Nieuwe test</button></div></div>';
  setAvatar();
  if (wrongs.length) document.getElementById('rw').onclick = () => startOefen(wrongs);
  document.getElementById('rn').onclick = () => renderStart();
  window.scrollTo(0, 0);
}
function showOefenResult() {
  const p = document.getElementById('panel'), n = Q.length, good = n - wrongs.length;
  p.innerHTML = '<div class="result"><div class="avatar-box av">📝</div><div class="score">' + good + '/' + n + '</div>' +
    '<div class="msg">' + (wrongs.length ? 'Nog ' + wrongs.length + ' fout. Doe ze nog een keer.' : 'Alle fouten zijn nu goed! 🎉') + '</div><div class="btns">' +
    (wrongs.length ? '<button class="btn alt" id="rw">✗ Doe de fouten opnieuw (' + wrongs.length + ')</button>' : '') +
    '<button class="btn" id="rn">↺ Nieuwe test</button></div></div>';
  setAvatar();
  if (wrongs.length) { const w = wrongs.slice(); document.getElementById('rw').onclick = () => startOefen(w); }
  document.getElementById('rn').onclick = () => renderStart();
}

/* ---------- AVATAR (uit overzicht_link.html in dezelfde map) ---------- */
let avatarSrc = null;
function setAvatar() {
  if (!avatarSrc) return;
  document.querySelectorAll('.av').forEach(el => { if (!el.querySelector('img')) el.innerHTML = '<img src="' + avatarSrc + '" alt="docent">'; });
}
fetch('overzicht_link.html')
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(h => { const m = h.match(/data:image\/[a-z]+;base64,[A-Za-z0-9+\/=]+/); if (m) { avatarSrc = m[0]; setAvatar(); } })
  .catch(() => {});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { const nb = document.getElementById('nb'); if (nb) { e.preventDefault(); nb.click(); } }
});

renderStart();
</script>
