  .avatar-box { width: 72px; height: 72px; flex-shrink: 0; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 4px 12px var(--shadow); background: white; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; overflow: hidden; }

  .header p { font-size: .85rem; color: var(--muted); margin-top: .2rem; }

  .uitleg { background: white; border-left: 5px solid var(--accent); border-radius: 12px; padding: .8rem 1rem; font-size: 1.05rem; line-height: 1.7; box-shadow: 0 2px 8px var(--shadow); margin-bottom: 1.2rem; font-weight: 700; }

  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: .45rem; margin-bottom: 1.2rem; }
  .tab { background: white; border: 2px solid transparent; border-radius: 14px; padding: .6rem .3rem; font-family: inherit; cursor: pointer; box-shadow: 0 2px 8px var(--shadow); text-align: center; transition: all .15s; color: var(--ink); }
  .tab .ic { font-size: 1.5rem; display: block; line-height: 1.2; }
  .tab .lb { font-size: .75rem; font-weight: 800; }
  .tab.active { border-color: var(--accent); background: #fff8eb; }
  .tab:hover { transform: translateY(-2px); }
  @media (max-width: 560px) { .tabs { grid-template-columns: repeat(3, 1fr); } }

  .panel { background: white; border-radius: 20px; padding: 1.5rem 1.3rem; box-shadow: 0 8px 32px var(--shadow); }
  .panel h2 { font-size: 1.1rem; font-weight: 900; color: var(--blue); margin-bottom: .3rem; }
  .panel .how { font-size: 1rem; color: var(--ink); font-weight: 700; margin-bottom: 1rem; }

  .progress { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); font-weight: 700; margin-bottom: .5rem; }
  .progress span { color: var(--blue); }
  .bar { background: rgba(45,58,140,.1); border-radius: 10px; height: 6px; overflow: hidden; margin-bottom: 1.2rem; }

  .speak { background: var(--blue); color: white; border: none; border-radius: 50px; padding: .8rem 1.6rem; font-family: inherit; font-size: 1.05rem; font-weight: 800; cursor: pointer; box-shadow: 0 3px 10px var(--shadow); }

check** even mijn mail.",["reageer","lukt","val"]],["defect","","","klein","De wasmachine doet het niet: hij is **defect**.",["kletsnat","opnieuw","opeens"]],["garantie","de","","klein","De tv is kapot, maar ik heb nog **garantie**.",["pizza","handdoek","voorletter"]],["handdoek","de","","klein","Na het douchen pak ik een **handdoek**.",["pizza","monteur","voorletter"]],["kletsnat","","","klein","Het regent hard. Ik ben **kletsnat**.",["defect","raar","opnieuw"]],["laken","het","","klein","Ik leg een schoon **laken** op het bed.",["beeldscherm","programma","pizza"]],["lukken","","","doe","Het **lukt** niet: ik snap het niet.",["checkt","reageert","probeert"]],["meevallen","","","doe","De rekening **valt mee**: maar 20 euro.",["lukt","checkt","reageert"]],["monteur","de","🧑‍🔧","mens","",[]],["ondergoed","het","","klein","Ik doe schoon **ondergoed** aan.",["beeldscherm","programma","pizza"]],["opeens","","","klein","**Opeens** deed de tv het niet meer.",["raar","defect","kletsnat"]],["oplossing","de","","klein","Is er een **oplossing** voor dit probleem?",["pizza","handdoek","voorletter"]],["opnieuw","","","klein","Het lukt niet. Probeer het **opnieuw**!",["opeens","raar","defect"]],["pizza","de","🍕","eten","",[]],["proberen","","","doe","Ik **probeer** de wasmachine te repareren.",["reageer","verzend","val mee"]],["programma","het","","klein","Kies het goede **programma** op de wasmachine.",["laken","ondergoed","beeldscherm"]],["raar","","","klein","De wasmachine maakt een **raar** geluid.",["kletsnat","opnieuw","opeens"]],["reageren","","","doe","Het bedrijf **reageert** niet op mijn mail.",["lukt","valt mee","probeert"]],["stuk (kapot)","","","klein","Mijn telefoon is **stuk**.",["opnieuw","opeens","vanmorgen"]],["vanmorgen","","","klein","**Vanmorgen** was de stroom weg.",["raar","kletsnat","defect"]],["verzenden","","","doe","Ik **verzend** de mail naar de monteur.",["probeer","reageer","lukt"]],["voorletter","de","","klein","Mijn naam is Iwan Jansen. Mijn **voorletter** is I.",["pizza","handdoek","garantie"]]]}};

const ALL = [];
Object.keys(DATA).forEach(n => DATA[n].w.forEach(r => ALL.push({ t: +n, w: r[0], a: r[1], e: r[2], g: r[3], z: r[4], d: r[5] })));
const THEMES = Object.keys(DATA).map(n => +n);

/* ---------- HULP ---------- */
// Fisher-Yates
function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// antwoordopties door elkaar, zodat het goede antwoord niet steeds bij A staat
function shuffleOpts(opts) { return shuffle(opts); }
function full(x) { return (x.a ? x.a + ' ' : '') + x.w; }
function spoken(s) { return s.replace(/\s*\([^)]*\)/g, ''); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function zinPlain(z) { return z.replace(/\*\*/g, ''); }
function zinForm(z) { const m = z.match(/\*\*(.+?)\*\*/); return m ? m[1] : ''; }

/* ---------- SPRAAK ---------- */
let nlVoice = null;
const canSpeak = 'speechSynthesis' in window;
function pickVoice() {
  if (!canSpeak) return;
  const v = speechSynthesis.getVoices();
  nlVoice = v.find(x => /^nl[-_]NL/i.test(x.lang)) || v.find(x => /^nl/i.test(x.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, slow) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.lang = 'nl-NL';
  if (nlVoice) u.voice = nlVoice;
  u.rate = slow ? 0.6 : 0.85;
  speechSynthesis.speak(u);
}

/* ---------- KEUZE ---------- */
const LS_KEY = 'link_herhaal_uit';
let off = [];
try { off = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { off = []; }
off = off.filter(n => THEMES.includes(n));
let aantal = 20;
function saveOff() { try { localStorage.setItem(LS_KEY, JSON.stringify(off)); } catch (e) {} }
function chosen() { return THEMES.filter(n => !off.includes(n)); }

function renderStart() {
  const p = document.getElementById('panel');
  const on = chosen();
  const n = ALL.filter(x => on.includes(x.t)).length;
  p.innerHTML = '<h2>🔁 Herhaal de woorden</h2>' +
    '<p class="how">👆 Tik op een thema om het <b>uit</b> te zetten (of weer <b>aan</b>).</p>' +
    '<div class="warn" id="warn"></div>' +
    '<div class="themes">' + THEMES.map(t => '<button class="th ' + (off.includes(t) ? 'off' : 'on') + '" data-t="' + t + '"><span class="ck">' + (off.includes(t) ? '' : '✓') + '</span><span><span class="n">Thema ' + t + '</span> · ' + esc(DATA[t].title) + '</span></button>').join('') + '</div>' +
    '<div class="row-label">Hoeveel vragen?</div><div class="pills" id="cnt">' +
    [10, 20, 40].map(c => '<button class="pill' + (c === aantal ? ' active' : '') + '" data-c="' + c + '">' + c + '</button>').join('') + '</div>' +
    (on.length ? '<div class="next-row"><button class="btn start" id="go">▶ Start</button></div><p class="tip">' + on.length + ' thema\'s · ' + n + ' woorden</p>'
               : '<p class="how">Zet minstens één thema aan.</p>');
  p.querySelectorAll('.th').forEach(b => b.onclick = () => {
    const t = +b.dataset.t;
    off = off.includes(t) ? off.filter(x => x !== t) : off.concat(t);
    saveOff(); renderStart();
  });
  p.querySelectorAll('#cnt .pill').forEach(b => b.onclick = () => { aantal = +b.dataset.c; renderStart(); });
  const go = document.getElementById('go');
  if (go) go.onclick = () => startQuiz(buildQuestions());
  setTimeout(() => {
    pickVoice();
    const w = document.getElementById('warn');
    if (!w) return;
    if (!canSpeak) { w.textContent = 'Deze browser kan niet voorlezen. Probeer een andere browser.'; w.style.display = 'block'; }
    else if (!nlVoice) { w.textContent = 'Tip: er is geen Nederlandse stem gevonden. Zet in de instellingen van je telefoon of computer de spraak op Nederlands.'; w.style.display = 'block'; }
  }, 800);
}

/* ---------- VRAGEN MAKEN ---------- */
function soort(y) { return y.a ? 'n' : (y.g === 'doe' ? 'v' : 'o'); }
// foute keuzes bij een plaatje: zelfde thema, zelfde soort woord, andere groep en ander plaatje
function pictureDistractors(x) {
  const ok = y => y !== x && y.e && !y.z && y.g !== x.g && y.e !== x.e;
  const same = y => ok(y) && soort(y) === soort(x);
  const th = ALL.filter(y => y.t === x.t);
  let cand = shuffle(th.filter(same));
  if (cand.length < 3) cand = cand.concat(shuffle(th.filter(y => ok(y) && !cand.includes(y))));
  return cand.slice(0, 3);
}
function luisterQ(x) {
  const th = ALL.filter(y => y.t === x.t && y !== x && spoken(y.w) !== spoken(x.w));
  const pick = [];
  for (const y of shuffle(th)) { if (pick.length < 3 && !pick.some(z => spoken(z.w) === spoken(y.w))) pick.push(y); }
  return { mode: 'luister', x, opts: shuffleOpts([x, ...pick]) };
}
function kiesQ(x) {
  if (x.z) {
    const ans = zinForm(x.z).toLowerCase();
    return { mode: 'kies', x, kind: 'zin', ans, opts: shuffleOpts([ans, ...x.d]) };
  }
  const ans = full(x);
  return { mode: 'kies', x, kind: 'plaatje', ans, opts: shuffleOpts([ans, ...pictureDistractors(x).map(full)]) };
}
function buildQuestions() {
  const on = chosen();
  const words = shuffle(ALL.filter(x => on.includes(x.t))).slice(0, aantal);
  return words.map(x => {
    const kinds = ['luister', 'kies', 'kies'];
    if (x.a) kinds.push('dehet');
    const k = kinds[Math.floor(Math.random() * kinds.length)];
    if (k === 'luister') return luisterQ(x);
    if (k === 'dehet') return { mode: 'dehet', x };
    return kiesQ(x);
  });
}

/* ---------- QUIZ ---------- */
let Q = [], qi = 0, score = 0, wrongs = [];
function startQuiz(list) {
  Q = list.map(q => q.opts ? { ...q, opts: shuffleOpts(q.opts) } : { ...q });
  qi = 0; score = 0; wrongs = [];
  renderQ();
}
function head() {
  return '<div class="progress"><div>Vraag <span>' + (qi + 1) + '</span> / ' + Q.length + '</div><div>✓ <span>' + score + '</span></div></div>' +
         '<div class="bar"><div style="width:' + (qi / Q.length * 100) + '%"></div></div>';
}
const HOW = { luister: '🔊 Luister. 👆 Kies het woord.', dehet: '👀 Kijk. 👆 <b>de</b> of <b>het</b>?', kies: '👀 Kijk. 👆 Kies het woord.' };
function renderQ() {
  if (qi >= Q.length) return showResult();
  const q = Q[qi], p = document.getElementById('panel');
  let html = head() + '<div class="theme-tag">Thema ' + q.x.t + ' · ' + esc(DATA[q.x.t].title) + '</div><p class="how" style="text-align:center">' + HOW[q.mode] + '</p>';
  if (q.mode === 'luister') {
    html += '<div class="listen-row"><button class="speak" id="sp">🔊 Luister</button><button class="speak slow" id="spS">🐢 Langzaam</button></div>' +
            '<div class="opts">' + q.opts.map((o, i) => '<button class="opt" data-i="' + i + '"><span class="oe">' + (o.e || '') + '</span>' + esc(o.w) + '</button>').join('') + '</div>';
  } else if (q.mode === 'dehet') {
    html += '<div class="big-emoji">' + (q.x.e || '') + '</div><div class="big-word">… ' + esc(q.x.w) + '</div>' +
            '<div class="opts"><button class="opt big" data-v="de">de</button><button class="opt big" data-v="het">het</button></div>';
  } else {
    if (q.kind === 'zin') html += '<div class="sentence" id="zin">' + esc(zinPlain(q.x.z.replace(/\*\*(.+?)\*\*/, '§'))).replace('§', '<span class="gap">&nbsp;</span>') + '</div>';
    else html += '<div class="big-emoji">' + q.x.e + '</div>';
    html += '<div class="opts">' + q.opts.map(o => '<button class="opt" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  }
  html += '<div class="fb" id="fb"></div><div class="next-row" id="nx"></div>';
  p.innerHTML = html;
  if (q.mode === 'luister') {
    document.getElementById('sp').onclick = () => say(full(q.x));
    document.getElementById('spS').onclick = () => say(full(q.x), true);
    say(full(q.x));
    p.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, q.opts[+b.dataset.i] === q.x, q.x.w));
  } else if (q.mode === 'dehet') {
    p.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, b.dataset.v === q.x.a, q.x.a));
  } else {
    p.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, b.dataset.v === q.ans, q.ans));
  }
}
function answer(btn, ok, correct) {
  const q = Q[qi], p = document.getElementById('panel');
  p.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const val = q.mode === 'luister' ? q.opts[+b.dataset.i].w : b.dataset.v;
    if (val === correct) b.classList.add('ok');
  });
  if (!ok) btn.classList.add('bad');
  if (ok) score++; else wrongs.push(q);
  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  if (q.mode === 'luister') fb.textContent = ok ? '✓ Goed! ' + full(q.x) : '✗ ' + full(q.x);
  else if (q.mode === 'dehet') { fb.textContent = (ok ? '✓ Goed! ' : '✗ ') + full(q.x); say(full(q.x)); }
  else if (q.kind === 'zin') {
    const form = zinForm(q.x.z);
    document.querySelector('#zin .gap').textContent = form;
    fb.textContent = ok ? '✓ Goed!' : '✗ ' + form;
    say(zinPlain(q.x.z));
  } else { fb.textContent = ok ? '✓ Goed! ' + q.ans : '✗ ' + q.ans; say(q.ans); }
  document.getElementById('nx').innerHTML = '<button class="btn" id="nb">' + (qi < Q.length - 1 ? 'Volgende →' : 'Klaar ✓') + '</button>';
  document.getElementById('nb').onclick = () => { qi++; renderQ(); };
  document.getElementById('nb').focus();
}
function showResult() {
  const p = document.getElementById('panel');
  const pct = Q.length ? score / Q.length : 0;
  const msg = pct === 1 ? 'Super! 🎉' : pct >= 0.8 ? 'Heel goed! 👍' : pct >= 0.5 ? 'Goed bezig! 💪' : 'Oefen de fouten. Je kunt het! 💪';
  p.innerHTML = '<div class="result"><div class="avatar-box av">🔁</div>' +
    '<div class="score">' + score + '/' + Q.length + '</div><div class="msg">' + msg + '</div><div class="btns">' +
    (wrongs.length ? '<button class="btn alt" id="rw">✗ Oefen de fouten (' + wrongs.length + ')</button>' : '') +
    '<button class="btn" id="rn">↺ Nieuwe ronde</button><button class="btn" id="rs" style="background:white;color:var(--blue);border:2px solid var(--blue)">Thema\'s kiezen</button></div></div>';
  setAvatar();
  if (wrongs.length) document.getElementById('rw').onclick = () => startQuiz(wrongs);
  document.getElementById('rn').onclick = () => startQuiz(buildQuestions());
  document.getElementById('rs').onclick = () => renderStart();
}

/* ---------- AVATAR (uit overzicht_link.html in dezelfde map) ---------- */
let avatarSrc = null;
function setAvatar() {
  if (!avatarSrc) return;
  document.querySelectorAll('.av').forEach(el => { if (!el.querySelector('img')) el.innerHTML = '<img src="' + avatarSrc + '" alt="docent">'; });
}
fetch('overzicht_link.html')
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(h => { const m = h.match(/data:image\/[a-z]+;base64,[A-Za-z0-9+\/=]+/); if (m) { avatarSrc = m[0]; setAvatar(); } })
  .catch(() => {});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { const nb = document.getElementById('nb'); if (nb) { e.preventDefault(); nb.click(); } }
});

renderStart();
</script>
